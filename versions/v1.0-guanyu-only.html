let AC=null,master=null,muted=false,bgmOn=false,noiseBuf=null,bgmT=0,bgmStep=0,bgmNote=4;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);}catch(e){}
}
function tone(f,d,type='square',v=.2,f2=null,delay=0){
  if(!AC||muted)return;const t=AC.currentTime+delay;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
function noise(d,v=.2,freq=1500,q=1,delay=0,f2=null){
  if(!AC||muted)return;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const t=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=noiseBuf;
  const bf=AC.createBiquadFilter();bf.type='bandpass';bf.frequency.setValueAtTime(freq,t);
  if(f2)bf.frequency.exponentialRampToValueAtTime(f2,t+d);bf.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(bf);bf.connect(g);g.connect(master);s.start(t);s.stop(t+d+.03);
}
const SFX={
  swing(){noise(.16,.35,700,1.2,0,4200);},
  eswing(){noise(.12,.18,900,1.2,0,3000);},

  hit(){tone(150,.12,'square',.16,50);noise(.1,.4,1700,.8);},
  clang(){tone(1300,.18,'triangle',.15,1100);tone(1900,.12,'square',.05,1700);noise(.05,.2,5000,2);},
  hurt(){tone(260,.22,'sawtooth',.15,90);},
  jump(){tone(300,.1,'sine',.12,520);},
  arrow(){noise(.14,.2,3000,3,0,6500);},
  special(){tone(160,.7,'sawtooth',.16,900);noise(.7,.35,300,.7,0,5000);tone(80,.6,'sine',.35,40,.25);},
  pickup(){tone(660,.08,'triangle',.2);tone(990,.14,'triangle',.2,null,.08);},
  die(){tone(220,.6,'sawtooth',.18,40);},

  clear(){[523,659,784,1046].forEach((f,i)=>tone(f,.3,'triangle',.18,null,i*.13));},
  deny(){tone(180,.1,'square',.1,150);}
};
function drum(d,v){tone(95,.35,'sine',.45*v,42,d);noise(.08,.15*v,220,1,d);}
const PENTA=[0,2,4,7,9];
function bgmTick(){
  if(!AC||muted||!bgmOn)return;
  const spb=60/116/2;
  if(bgmT<AC.currentTime)bgmT=AC.currentTime+.05;
  while(bgmT<AC.currentTime+.25){
    const st=bgmStep%16,d=bgmT-AC.currentTime;
    if(st===0||st===6||st===8||st===11)drum(d,st===0?1:.55);
    if(st%4===2)noise(.04,.05,6000,1,d);
    if(st%2===0&&Math.random()<.72){
      bgmNote=Math.max(0,Math.min(9,bgmNote+[-2,-1,1,2,0][Math.random()*5|0]));
      const n=PENTA[bgmNote%5]+12*Math.floor(bgmNote/5);
      tone(196*Math.pow(2,n/12),spb*1.7,'triangle',.055,null,d);
    }
    if(st===0)tone([98,87.3,110,98][(bgmStep>>4)%4],spb*15,'sine',.07,null,d);
    bgmT+=spb;bgmStep++;
  }
}

/* ================= 스프라이트 아틀라스 ================= */
const ATL={};
const img=new Image();
function recolor(src,fn){
  const c=document.createElement('canvas');c.width=src.width;c.height=src.height;
  const g=c.getContext('2d'),d=g.createImageData(src.width,src.height),s=src.data,o=d.data;
  for(let i=0;i<s.length;i+=4){if(!s[i+3])continue;const r=fn(s[i],s[i+1],s[i+2]);o[i]=r[0];o[i+1]=r[1];o[i+2]=r[2];o[i+3]=s[i+3];}
  g.putImageData(d,0,0);return c;
}
function swap(cloth,skin){
  return (r,g,b)=>{
    if(g>r+12&&g>b){const l=g/190;return [Math.min(255,cloth[0]*l),Math.min(255,cloth[1]*l),Math.min(255,cloth[2]*l)];}
    if(r>g+70&&r>b+50){const l=r/215;return [Math.min(255,skin[0]*l),Math.min(255,skin[1]*l),Math.min(255,skin[2]*l)];}
    return [r,g,b];
  };
}
function buildAtlases(){
  const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
  const g=c.getContext('2d');g.drawImage(img,0,0);ATL.guan=c;
  const d=g.getImageData(0,0,c.width,c.height);
  ATL.white=recolor(d,()=>[255,255,255]);
  ATL.yellow=recolor(d,swap([235,185,40],[222,176,128]));
  ATL.crimson=recolor(d,swap([150,28,38],[205,150,112]));
  ATL.blue=recolor(d,swap([60,100,190],[225,172,132]));
}
function spr(atl,name,x,y,face,sc,alpha=1,comp){
  const f=FR[name];if(!f||!ATL[atl])return;
  ctx.save();ctx.globalAlpha=alpha;if(comp)ctx.globalCompositeOperation=comp;
  ctx.translate(Math.round(x),Math.round(y));ctx.scale(face*sc,sc);
  ctx.drawImage(ATL[atl],f[0],f[1],f[2],f[3],-f[4],-f[5],f[2],f[3]);ctx.restore();
}

  a3:{steps:[{f:'raiseA',t:8},{f:'raiseB',t:12,mv:2},{f:'thrust',t:24,fx:'arc',sfx:'heavy',hit:{x0:0,x1:175,y0:-145,y1:10,dmg:22,kx:10,ky:-6,stun:44,brk:1,shake:9}}]},
  air:{steps:[{f:'jumpB',t:16,sfx:'swing',hit:{x0:-20,x1:105,y0:-120,y1:40,dmg:12,kx:4,ky:3,stun:24}}]},
  sp:{steps:[{f:'raiseA',t:10},{f:'raiseB',t:16},{f:'slashA',t:34,sfx:'special',wave:1,hit:{x0:-70,x1:245,y0:-175,y1:10,dmg:26,kx:12,ky:-9,stun:50,brk:1,shake:14}}],inv:1}
};
function newPlayer(){return {isPlayer:1,x:220,y:GY,vx:0,vy:0,face:1,hp:100,mp:30,st:'idle',t:0,atk:null,step:0,stepT:0,
  buf:0,inv:0,hits:new Set(),air:false,airAtk:false,combo:0,comboT:0,deadT:0,w:44,h:112};}
function startAtk(n){const p=player;p.st='atk';p.atk=n;p.step=0;p.stepT=0;p.buf=0;if(ATK[n].inv)p.inv=Math.max(p.inv,80);if(!p.air)p.vx=0;}
function updPlayer(){
  const p=player;
  if(p.inv>0)p.inv--;
  if(p.comboT>0&&--p.comboT===0)p.combo=0;
  p.mp=Math.min(100,p.mp+.025);
  if(p.st==='dead'){phys(p);p.vx*=.92;p.deadT++;return;}
  if(p.spBuf>0)p.spBuf--;
  if(p.st==='hurt'){
    if(p.spBuf>0&&p.mp>=50&&!p.air&&p.hp>0){p.spBuf=0;p.mp-=50;startAtk('sp');texts.push({x:p.x,y:p.y-140,s:'반격!',c:'#9ff3ff',life:40});return;}
    p.t--;phys(p);p.vx*=.86;if(p.t<=0&&!p.air)p.st='idle';return;}
  if(p.buf>0)p.buf--;
  if(p.st==='atk'){
    const A=ATK[p.atk],S=A.steps[p.step];
    if(p.stepT===0){
      if(S.mv)p.vx=S.mv*p.face*1.6;
      if(S.sfx)SFX[S.sfx]();
      if(S.hit)p.hits=new Set();
      if(S.fx==='arc')fxs.push({k:'arc',x:p.x+p.face*95,y:p.y-10,face:p.face,t:0,life:16});
      if(S.wave){flash=.55;cam.shake=12;
        projs.push({k:'cres',from:'p',x:p.x+p.face*60,y:p.y-10,vx:p.face*12,life:70,hit:new Set(),face:p.face});}
    }
    if(S.hit&&p.stepT<7)doHits(p,S.hit);
    p.stepT++;if(!p.air)p.vx*=.84;
    if(A.next&&p.step===A.steps.length-1&&p.stepT>=A.cancel&&p.buf>0){startAtk(A.next);}
    else if(p.stepT>=S.t){p.step++;p.stepT=0;if(p.step>=A.steps.length){p.st=p.air?'jump':'idle';p.atk=null;}}
    phys(p);
    if(p.atk==='air'&&!p.air){p.st='idle';p.atk=null;}
    return;
  }
  const mx=(K.right?1:0)-(K.left?1:0);
  if(mx)p.face=mx;
  p.vx=mx*4.3;
  if(P.jump&&!p.air){p.vy=-13.5;p.air=true;SFX.jump();dust(p.x,GY,6);}
  if(p.spBuf>0&&!p.air){
    p.spBuf=0;
    if(p.mp>=50){p.mp-=50;startAtk('sp');phys(p);return;}
    else{SFX.deny();texts.push({x:p.x,y:p.y-130,s:'기력 부족',c:'#9cf',life:40});}
  }
  if(p.buf>0){
    if(p.air){if(!p.airAtk){p.airAtk=true;startAtk('air');}}
    else{startAtk('a1');phys(p);return;}
  }
  p.st=p.air?'jump':(mx?'walk':'idle');
  phys(p);p.t++;
}
function hurtPlayer(dmg,dir){
  const p=player;
  if(p.inv>0||p.st==='dead'||G.bossDead)return false;
  p.hp-=dmg;p.inv=55;p.st='hurt';p.t=18;p.vx=dir*5;p.atk=null;p.combo=0;p.comboT=0;
  SFX.hurt();cam.shake=Math.max(cam.shake,6);hitstop=4;
  texts.push({x:p.x,y:p.y-120,s:'-'+dmg,c:'#ff6b5b',life:40});
  sparks(p.x,p.y-60,'#ffb0a0',8);
  if(p.hp<=0){p.hp=0;p.st='dead';p.deadT=0;p.vy=-6;p.air=true;SFX.die();slowmo=60;}
  return true;
}

/* ================= 물리 / 판정 ================= */
function phys(o){
  o.x+=o.vx;
  if(o.air){o.vy+=.7;o.y+=o.vy;
    if(o.y>=GY){o.y=GY;
      if(o.vy>6&&!o.isPlayer){o.vy=-o.vy*.35;dust(o.x,GY,5);}
      else{o.vy=0;o.air=false;if(o.isPlayer){o.airAtk=false;dust(o.x,GY,3);}}}}
}
function hbox(o,x0,x1){return o.face>0?[o.x+x0,o.x+x1]:[o.x-x1,o.x-x0];}
function doHits(p,h){
  const [a,b]=hbox(p,h.x0,h.x1),y0=p.y+h.y0,y1=p.y+h.y1;
  for(const e of enemies){
    if(e.dead||p.hits.has(e)||e.entering)continue;
    if(e.x+e.w/2<a||e.x-e.w/2>b)continue;
    if(e.y<y0||e.y-e.h>y1)continue;
    p.hits.add(e);hitEnemy(e,h,p.face);
  }
  for(const q of projs){
    if(q.from==='e'&&q.k==='arrow'&&!q.gone&&q.x>a-10&&q.x<b+10&&q.y>y0&&q.y<y1){
      q.gone=true;sparks(q.x,q.y,'#fff',8);SFX.clang();addScore(50);texts.push({x:q.x,y:q.y-20,s:'튕겨냄!',c:'#fff',life:35});}
  }
}
function hitEnemy(e,h,dir){
  const p=player;let dmg=h.dmg;
  const front=e.face===-dir;
  if(e.type==='shield'&&front&&!h.brk&&!e.air&&e.stun<=0&&e.st!=='strike'){
    dmg=Math.max(1,Math.round(dmg*.15));e.hp-=dmg;e.vx=dir*2.5;e.flash=4;
    SFX.clang();sparks(e.x-dir*10,e.y-60,'#fff6c0',10);hitstop=3;
    texts.push({x:e.x,y:e.y-e.h-10,s:'막힘',c:'#ddd',life:30});
    if(e.hp<=0)kill(e,dir);return;
  }
  e.hp-=dmg;e.flash=6;
  if(e.boss){
    e.poise+=1;e.poiseT=120;
    const armored=(e.st==='wind'||e.st==='strike'||e.armorT>0)&&!h.brk;
    if(!armored){e.stun=Math.round(h.stun*.4);e.vx=h.kx*dir*.4;e.st='hurt';if(h.ky&&h.brk){e.vy=h.ky*.5;e.air=true;}}
    if(e.poise>=7){e.poise=0;e.armorT=100;e.stun=0;e.st='idle';e.cd=0;texts.push({x:e.x,y:e.y-170,s:'분노!',c:'#ff5040',life:50});}
  }else{
    e.stun=h.stun;e.vx=h.kx*dir*(e.heavy?.6:1);e.st='hurt';e.t=0;
    if(h.ky){e.vy=h.ky*(e.heavy?.7:1);e.air=true;}else if(e.air){e.vy=-4;}
  }
  p.mp=Math.min(100,p.mp+3);p.combo++;p.comboT=100;
  addScore(dmg*10*(1+p.combo*.1));
  hitstop=Math.max(hitstop,h.shake?7:4);cam.shake=Math.max(cam.shake,h.shake||3);
  SFX.hit();sparks(e.x-dir*8,e.y-e.h*.55,'#fff2a8',12);
  texts.push({x:e.x+rnd(-10,10),y:e.y-e.h-12,s:''+dmg,c:'#ffe066',life:36});
  if(e.hp<=0)kill(e,dir);
}
function kill(e,dir){
  e.dead=true;e.deadT=0;e.vy=-7;e.air=true;e.vx=dir*4;e.hp=0;
  addScore(e.boss?5000:e.type==='captain'?800:300);
  if(!e.boss&&(e.type==='captain'||Math.random()<.13))
    items.push({k:Math.random()<.6?'bun':'wine',x:e.x,y:e.y-40,vy:-6,t:0});
  if(e.boss){
    G.bossDead=true;G.bossDeadT=0;slowmo=90;hitstop=18;flash=.9;cam.shake=16;
    banner={text:'적장 '+e.name+' 격파!',sub:'관운장의 청룡언월도가 번뜩였다',t:200};
    for(const o of enemies)if(!o.dead){o.dead=true;o.deadT=0;o.vy=-5;o.air=true;o.vx=dir*3;addScore(200);}
    spawnQ.length=0;
  }
}

/* ================= 적 ================= */
const ETYPES={
  spear:  {hp:34,w:40,h:92,spd:1.5,sc:1,reach:78,dmg:7},
  archer: {hp:24,w:40,h:90,spd:1.3,sc:1,reach:0,dmg:6},
  shield: {hp:55,w:46,h:94,spd:1.0,sc:1,reach:64,dmg:6},
  captain:{hp:110,w:56,h:120,spd:1.25,sc:1.3,reach:100,dmg:12,heavy:1}
};
function newEnemy(type,x){
  const b=ETYPES[type];
  return Object.assign({type,x,y:GY,vx:0,vy:0,face:x<player.x?1:-1,max:b.hp,st:'walk',t:0,cd:rnd(50,110),
    stun:0,flash:0,air:false,dead:false,deadT:0,anim:rnd(0,20),struck:false},b);
}
function newBoss(B,x){
  return {boss:1,type:'boss',name:B.name,atl:B.atl,x,y:GY,vx:0,vy:0,face:-1,hp:B.hp,max:B.hp,spd:B.spd,aggr:B.aggr,
    w:60,h:135,sc:.74,st:'walk',t:0,cd:60,stun:0,flash:0,air:false,dead:false,deadT:0,anim:0,move:null,step:0,
    poise:0,poiseT:0,armorT:0,struck:false,entering:false};
}
function attackers(){let n=0;for(const e of enemies)if(!e.dead&&(e.st==='wind'||e.st==='strike'||e.st==='draw'))n++;return n;}
function enemyHitPlayer(e,x0,x1,y0,y1,dmg){
  const p=player,[a,b]=hbox(e,x0,x1);
  if(p.x+20<a||p.x-20>b)return false;
  if(p.y<e.y+y0||p.y-p.h>e.y+y1)return false;
  return hurtPlayer(dmg,e.face);
}
function updEnemy(e){
  e.anim++;if(e.flash>0)e.flash--;
  if(e.dead){e.deadT++;phys(e);if(!e.air)e.vx*=.85;return;}
  if(e.boss)return updBoss(e);
  if(e.stun>0){e.stun--;phys(e);if(!e.air)e.vx*=.82;if(e.stun===0){if(e.air)e.stun=1;else{e.st='idle';e.cd=Math.max(e.cd,30);}}return;}
  phys(e);if(!e.air)e.vx*=.7;
  const p=player,dx=p.x-e.x,ad=Math.abs(dx),pdead=p.st==='dead';
  if(e.st==='walk'||e.st==='idle')e.face=dx>0?1:-1;
  if(e.cd>0)e.cd--;
  if(e.type==='archer'){
    if(e.st==='walk'||e.st==='idle'){
      let want=0;if(ad<250)want=-Math.sign(dx);else if(ad>430)want=Math.sign(dx);
      const nx=e.x+want*e.spd,mid=cam.x+W/2;
      if(want&&((nx>cam.x+25&&nx<cam.x+W-25)||Math.abs(nx-mid)<Math.abs(e.x-mid))){e.x=nx;e.st='walk';}else e.st='idle';
      if(e.cd<=0&&!pdead&&ad<620&&e.x>cam.x&&e.x<cam.x+W&&attackers()<3){e.st='draw';e.t=42;}
    }else if(e.st==='draw'){
      if(--e.t<=0){projs.push({k:'arrow',from:'e',x:e.x+e.face*28,y:e.y-58,vx:e.face*6.5,life:220});
        SFX.arrow();e.st='idle';e.cd=rnd(120,200);}
    }
    return;
  }
  const reach=e.reach;
  if(e.st==='walk'||e.st==='idle'){
    if(ad>reach-8&&!pdead){e.x+=Math.sign(dx)*e.spd;e.st='walk';}
    else{e.st='idle';if(e.cd<=0&&!pdead&&attackers()<2){e.st='wind';e.t=e.heavy?36:28;}}
  }else if(e.st==='wind'){
    if(--e.t<=0){e.st='strike';e.t=14;e.struck=false;SFX.eswing();if(e.heavy)e.vx=e.face*3;}
  }else if(e.st==='strike'){
    if(e.t>7&&!e.struck){if(enemyHitPlayer(e,15,reach+14,-95,-15,e.dmg))e.struck=true;}
    if(--e.t<=0){e.st='idle';e.cd=rnd(70,150);}
  }
}
function updBoss(e){
  const p=player,dx=p.x-e.x,ad=Math.abs(dx);
  if(e.armorT>0)e.armorT--;
  if(e.poiseT>0&&--e.poiseT===0)e.poise=0;
  if(e.stun>0){e.stun--;phys(e);if(!e.air)e.vx*=.8;if(e.stun===0){if(e.air)e.stun=1;else{e.st='idle';e.cd=Math.max(e.cd,20);}}return;}
  phys(e);if(!e.air)e.vx*=.8;
  if(e.cd>0)e.cd--;
  if(e.st==='walk'||e.st==='idle'||e.st==='hurt'){
    e.face=dx>0?1:-1;
    if(p.st==='dead'){e.st='idle';return;}
    if(ad>150){e.x+=Math.sign(dx)*e.spd;e.st='walk';}else e.st='idle';
    if(e.cd<=0){
      const r=Math.random();
      if(ad>260&&r<.4*e.aggr)startBossMove(e,'leap');
      else if(ad<=190){startBossMove(e,r<.55?'sweep':'smash');}
    }
    return;
  }
  // 공격 진행
  e.t++;
  const M=e.move;
  if(M==='sweep'){
    const wind=Math.round(26/e.aggr);
    if(e.step===0){e.st='wind';if(e.t>=wind){e.step=1;e.t=0;e.st='strike';e.struck=false;e.vx=e.face*6;SFX.swing();}}
    else{if(e.t<8&&!e.struck&&enemyHitPlayer(e,0,205,-125,5,13))e.struck=true;if(e.t>=16)endBossMove(e,30);}
  }else if(M==='smash'){
    const w1=Math.round(22/e.aggr),w2=Math.round(18/e.aggr);
    if(e.step===0){e.st='wind';if(e.t>=w1){e.step=1;e.t=0;}}
    else if(e.step===1){if(e.t>=w2){e.step=2;e.t=0;e.st='strike';e.struck=false;SFX.heavy();cam.shake=8;
      fxs.push({k:'arc',x:e.x+e.face*100,y:e.y-10,face:e.face,t:0,life:16,boss:1});
      if(G.stage>=1)projs.push({k:'quake',from:'e',x:e.x+e.face*90,y:GY,vx:e.face*7,life:90,face:e.face});}}
    else{if(e.t<8&&!e.struck&&enemyHitPlayer(e,0,180,-150,10,18))e.struck=true;if(e.t>=26)endBossMove(e,40);}
  }else if(M==='leap'){
    if(e.step===0){e.st='wind';if(e.t>=14){e.step=1;e.t=0;e.vy=-14;e.air=true;e.vx=Math.max(-9,Math.min(9,dx/38));SFX.jump();}}
    else if(e.step===1){if(!e.air){e.step=2;e.t=0;e.st='strike';e.struck=false;e.vx=0;dust(e.x,GY,10);SFX.swing();e.face=player.x>e.x?1:-1;}}
    else{if(e.t<8&&!e.struck&&enemyHitPlayer(e,-15,150,-180,5,15))e.struck=true;if(e.t>=20)endBossMove(e,35);}
  }
}
function startBossMove(e,m){e.move=m;e.step=0;e.t=0;e.st='wind';}
function endBossMove(e,rest){e.move=null;e.st='idle';e.cd=Math.round(rest+rnd(10,50)/e.aggr);}
function separate(){
  const al=enemies.filter(e=>!e.dead&&!e.air);
  for(let i=0;i<al.length;i++)for(let j=i+1;j<al.length;j++){
    const a=al[i],b=al[j],d=b.x-a.x,min=(a.w+b.w)*.42;
    if(Math.abs(d)<min){const s=d>=0?1:-1,push=(min-Math.abs(d))*.5;if(!a.boss)a.x-=s*push*.6;if(!b.boss)b.x+=s*push*.6;}
  }
  if(player.air||player.st==='dead')return;
  for(const e of al){const d=e.x-player.x,min=e.boss?70:40;
    if(Math.abs(d)<min){const s=d>=0?1:-1;e.x+=s*Math.min(3,min-Math.abs(d));}}
}

/* ================= 투사체 / 아이템 / 효과 ================= */
function updProjs(){
  for(const q of projs){
    q.x+=q.vx;q.life--;
    if(q.k==='arrow'){if(q.from==='e'&&Math.abs(q.x-player.x)<20&&q.y>player.y-player.h&&q.y<player.y){if(hurtPlayer(6,Math.sign(q.vx)))q.gone=true;}}
    else if(q.k==='quake'){
      if(G.t%3===0)dust(q.x,GY,2,'#c9b08a');
      if(Math.abs(q.x-player.x)<30&&!player.air){if(hurtPlayer(11,q.face))q.gone=true;}
    }else if(q.k==='cres'){
      for(const e of enemies){if(e.dead||q.hit.has(e)||e.entering)continue;
        if(Math.abs(e.x-q.x)<70){q.hit.add(e);hitEnemy(e,{dmg:30,kx:8,ky:-10,stun:50,brk:1,shake:8},q.face);}}
      for(const a of projs)if(a.from==='e'&&a.k==='arrow'&&Math.abs(a.x-q.x)<60)a.gone=true;
      if(G.t%2===0)sparks(q.x-q.face*30,GY-rnd(10,140),'#bff8e0',1);
    }
    if(q.x<cam.x-200||q.x>cam.x+W+200)q.gone=true;
    if(q.life<=0)q.gone=true;
  }
  projs=projs.filter(q=>!q.gone);
}
function updItems(){
  for(const it of items){
    it.t++;if(it.y<GY){it.vy+=.5;it.y=Math.min(GY,it.y+it.vy);}
    if(Math.abs(it.x-player.x)<40&&player.y>GY-30&&player.st!=='dead'&&it.t>20){
      it.gone=true;SFX.pickup();
      if(it.k==='bun'){player.hp=Math.min(100,player.hp+30);texts.push({x:it.x,y:it.y-60,s:'체력 +30',c:'#8f8',life:45});}
      else{player.mp=Math.min(100,player.mp+50);texts.push({x:it.x,y:it.y-60,s:'기력 +50',c:'#8cf',life:45});}
      addScore(100);
    }
    if(it.t>900)it.gone=true;
  }
  items=items.filter(i=>!i.gone);
}
function sparks(x,y,c,n){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(2,8);parts.push({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(10,22),c});}}
function dust(x,y,n,c='#d8c8a8'){for(let i=0;i<n;i++)parts.push({k:'dust',x:x+rnd(-20,20),y:y-rnd(0,8),vx:rnd(-1.5,1.5),vy:rnd(-1.6,-.3),life:rnd(18,32),max:32,r:rnd(5,10),c});}
function updParts(){
  for(const s of parts){s.x+=s.vx;s.y+=s.vy;s.life--;if(s.k==='spark'){s.vx*=.9;s.vy=s.vy*.9+.25;}else{s.r+=.3;s.vx*=.95;}}
  parts=parts.filter(s=>s.life>0);
  for(const t of texts){t.y-=.8;t.life--;}texts=texts.filter(t=>t.life>0);
  for(const f of fxs)f.t++;fxs=fxs.filter(f=>f.t<f.life);
}

function loadStage(){
  const S=STAGES[G.stage];
  player=newPlayer();player.hp=G.carryHP;player.mp=G.carryMP;
  enemies=[];projs=[];parts=[];items=[];texts=[];fxs=[];spawnQ=[];
  cam={x:0,lock:null,shake:0};
  G.wave=0;G.inWave=false;G.bossOn=false;G.bossDead=false;G.bossDeadT=0;G.stageScore=G.score;G.paused=false;
  banner={text:S.name,sub:S.sub,t:200};hitstop=0;slowmo=0;flash=0;goArrow=120;
}
function startGame(){G.score=0;G.stage=0;G.carryHP=100;G.carryMP=30;loadStage();G.mode='play';bgmOn=true;}
function retryStage(){G.score=G.stageScore;G.carryHP=100;G.carryMP=30;loadStage();G.mode='play';}
function stageClear(){G.mode='clear';G.ct=0;G.bonus=Math.round(player.hp)*30;G.score+=G.bonus;SFX.clear();saveHi();}
function nextStage(){
  G.carryHP=Math.min(100,player.hp+50);G.carryMP=player.mp;G.stage++;
  if(G.stage>=STAGES.length){G.mode='ending';G.ct=0;saveHi();return;}
  loadStage();G.mode='play';
}
function queueSpawns(list){
  list.forEach((type,i)=>spawnQ.push({type,side:i%2?-1:1,delay:i===0?20:rnd(35,70)}));
}
function spawnTick(){
  if(!spawnQ.length)return;
  if(--spawnQ[0].delay<=0){
    const s=spawnQ.shift(),base=cam.lock!==null?cam.lock:cam.x;
    enemies.push(newEnemy(s.type,s.side<0?base-60:base+W+60));
  }
}
function waveCheck(){
  const S=STAGES[G.stage];
  if(cam.lock===null){
    const front=player.x-W*.4;
    if(G.wave<S.waves.length){const w=S.waves[G.wave];if(front>=w.at){cam.lock=w.at;G.inWave=true;queueSpawns(w.list);}}
    else if(!G.bossOn&&front>=S.len-W-5){
      cam.lock=S.len-W;G.bossOn=true;
      const B=S.boss,b=newBoss(B,cam.lock+W+90);enemies.push(b);
      banner={text:B.name,sub:'적장이 나타났다!',t:170,boss:1};SFX.boss();
      B.minions.forEach((m,i)=>spawnQ.push({type:m,side:i%2?-1:1,delay:90+i*40}));
    }
  }else if(G.inWave&&!spawnQ.length&&enemies.every(e=>e.dead)){
    G.inWave=false;cam.lock=null;G.wave++;goArrow=180;
  }
}
function updCamera(){
  const S=STAGES[G.stage];
  let tx=Math.max(0,Math.min(S.len-W,player.x-W*.4));
  if(cam.lock!==null)tx=cam.lock;
  cam.x+=(tx-cam.x)*.12;if(Math.abs(tx-cam.x)<.5)cam.x=tx;
  const lo=cam.lock!==null?cam.lock:cam.x;
  player.x=Math.max(lo+30,Math.min(lo+W-30,player.x));
}
function update(){
  updPlayer();updCamera();spawnTick();
  for(const e of enemies)updEnemy(e);
  separate();updProjs();updItems();updParts();waveCheck();
  enemies=enemies.filter(e=>!(e.dead&&e.deadT>100&&!e.boss));
  if(cam.shake>0){cam.shake*=.86;if(cam.shake<.4)cam.shake=0;}
  if(flash>0)flash=Math.max(0,flash-.04);
  if(goArrow>0)goArrow--;
  if(banner&&--banner.t<=0)banner=null;
  if(player.st==='dead'&&player.deadT>150){G.mode='over';G.ct=0;saveHi();}
  if(G.bossDead&&++G.bossDeadT>230)stageClear();
}
function tick(){
  G.t++;bgmTick();
  if(P.mute)muted=!muted;
  if(G.mode==='title'){if(P.start||P.atk)startGame();return;}
  if(G.mode==='play'){
    if(P.pause)G.paused=!G.paused;
    if(G.paused)return;
    if(P.atk&&player)player.buf=10;
    if(P.sp&&player)player.spBuf=10;
    if(hitstop>0){hitstop--;return;}
    if(slowmo>0){slowmo--;if(G.t&1){return;}}
    update();return;
  }
  G.ct++;updParts();
  if(G.mode==='clear'&&G.ct>70&&(P.start||P.atk))nextStage();
  else if(G.mode==='over'&&G.ct>60&&(P.start||P.atk))retryStage();
  else if(G.mode==='ending'&&G.ct>120&&(P.start||P.atk))G.mode='title';
}

function ridge(off,base,amp,col,seed){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,GY);
  for(let x=0;x<=W+10;x+=10){const X=x+off;
    ctx.lineTo(x,base-amp*(.55+.45*Math.sin(X*.0045+seed))-amp*.35*Math.sin(X*.013+seed*2)-amp*.15*Math.sin(X*.031+seed*3));}
  ctx.lineTo(W,GY);ctx.closePath();ctx.fill();
}
function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function each(cx,par,gap,fn){const o=cx*par;for(let k=Math.floor(o/gap)-1;k<=Math.ceil((o+W)/gap)+1;k++)fn(k*gap-o,k);}

function ground(cx,top,dark,grass,tile){
  ctx.fillStyle=top;ctx.fillRect(0,GY-6,W,H-GY+6);
  if(grass){ctx.fillStyle=grass;ctx.fillRect(0,GY-10,W,8);}
  ctx.fillStyle=dark;
  if(tile){for(let y=GY+8;y<H;y+=24){const o=(cx+(y%48?0:40))%80;for(let x=-o;x<W;x+=80)ctx.fillRect(x,y,2,24);ctx.fillRect(0,y,W,2);}}
  else each(cx,1,60,(x,k)=>{const r=hash(k);ctx.fillRect(x+r*40,GY+14+r*50,18+r*22,3);});
  const gg=ctx.createLinearGradient(0,GY,0,H);gg.addColorStop(0,'rgba(0,0,0,0)');gg.addColorStop(1,'rgba(0,0,0,.35)');ctx.fillStyle=gg;ctx.fillRect(0,GY,W,H-GY);
}
function drawBG(theme,cx){if(theme==='field')bgField(cx);else if(theme==='gate')bgGate(cx);else bgRiver(cx);}

function shadow(x,y,w,air){const k=Math.max(.35,1-(GY-y)/220);ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x,GY+2,w*k,7*k,0,0,7);ctx.fill();}
const IDLE=['idle2','idle3','idle4','idle5','idle4','idle3'];
function playerFrame(p){
  if(p.st==='dead')return p.air?'jumpA':'dead';
  if(p.st==='hurt')return 'idle0';
  if(p.st==='atk')return ATK[p.atk].steps[p.step].f;
  if(p.st==='jump')return 'jumpA';
  if(p.st==='walk')return ['idle0','idle1'][(G.t/8|0)%2];
  return IDLE[(G.t/9|0)%6];
}
function drawPlayer(){
  const p=player,sx=p.x-cam.x;shadow(sx,p.y,36);
  const fr=playerFrame(p);
  let bob=p.st==='walk'?-Math.abs(Math.sin(G.t*.2))*3:0;
  const blink=p.inv>0&&p.st!=='atk'&&p.st!=='dead'&&(G.t>>2)&1;
  if(p.atk==='sp'&&p.step<2){ctx.save();ctx.globalCompositeOperation='lighter';
    circle(sx,p.y-60,60+Math.sin(G.t*.5)*8,'rgba(90,255,170,.18)');ctx.restore();}
  spr('guan',fr,sx,p.y+bob,p.face,PS,blink?.35:1);
  if(p.st==='hurt')spr('white',fr,sx,p.y,p.face,PS,.55);
}
function bossFrame(e){
  if(e.dead)return e.air?'jumpA':'dead';
  if(e.st==='hurt'||e.stun>0)return 'idle0';
  const M=e.move;
  if(M==='sweep')return e.step===0?'thrust':'slashA';
  if(M==='smash')return ['raiseA','raiseB','thrust'][e.step];
  if(M==='leap')return e.step===2?'slashB':(e.step===1?'jumpA':'idle4');
  if(e.st==='walk')return ['idle0','idle1'][(e.anim/9|0)%2];
  return IDLE[(e.anim/10|0)%6];
}
function drawBoss(e){
  const sx=e.x-cam.x;if(!(e.dead&&e.deadT>60&&(e.deadT>>2)&1))shadow(sx,e.y,44);
  if(e.dead&&e.deadT>160)return;
  const fr=bossFrame(e);
  if(e.armorT>0){ctx.save();ctx.globalCompositeOperation='lighter';circle(sx,e.y-70,70,'rgba(255,60,30,.15)');ctx.restore();}
  spr(e.atl,fr,sx,e.y,e.face,e.sc);
  if(e.flash>0)spr('white',fr,sx,e.y,e.face,e.sc,.6);
  else if(e.st==='wind'&&(e.t>>2)&1)spr('white',fr,sx,e.y,e.face,e.sc,.28);
}
function R(c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}

  const S=STAGES[G.stage].foe,u=3*e.sc,sx=e.x-cam.x;
  if(e.dead&&e.deadT>55&&(e.deadT>>2)&1)return;

  if(e.dead){const k=Math.min(1,e.deadT/14);ctx.rotate(-e.face*k*1.45);}
  else if(e.stun>0&&e.air)ctx.rotate(-e.face*.5);

  const fl=e.flash>0,C=c=>fl?'#ffffff':c;

  const lean=e.stun>0?-1.5*u:(e.st==='strike'?1.2*u:0);

  R(C('#1d1610'),-3.5*u+wk*2*u,-1.6*u,4*u,1.6*u);R(C('#1d1610'),1*u-wk*2*u,-1.6*u,4*u,1.6*u);

    else{ctx.moveTo(16*u+off,-18.9*u);ctx.lineTo(21.5*u+off,-17.6*u);ctx.lineTo(16*u+off,-16.2*u);}

    circle(5.25*u+off,-17*u,1.4*u,tel?'#ff4a3a':C('#c9a43a'));
  }
  ctx.restore();
  if(!e.dead&&e.hp<e.max){const bw=40*e.sc;R('rgba(0,0,0,.5)',sx-bw/2,e.y-e.h-14,bw,5);R('#e04a3a',sx-bw/2,e.y-e.h-14,bw*e.hp/e.max,5);}
}

function txt(s,x,y,size,col,align='center',font=FU,stroke='rgba(0,0,0,.75)',sw=4){
  ctx.font=`bold ${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='middle';
  if(stroke){ctx.lineWidth=sw;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function goldText(s,x,y,size,font=FT){
  ctx.font=`bold ${size}px ${font}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=size/8;ctx.strokeStyle='#2a1406';ctx.lineJoin='round';ctx.strokeText(s,x,y);
  const g=ctx.createLinearGradient(0,y-size/2,0,y+size/2);g.addColorStop(0,'#fff3b8');g.addColorStop(.5,'#f2c14e');g.addColorStop(1,'#b8741e');
  ctx.fillStyle=g;ctx.fillText(s,x,y);
}
function render(){
  if(G.mode==='loading'){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);txt('불러오는 중…',W/2,H/2,22,'#ccc');return;}
  if(G.mode==='title')return drawTitle();
  const S=STAGES[G.stage];
  ctx.save();
  if(cam.shake)ctx.translate(rnd(-1,1)*cam.shake,rnd(-1,1)*cam.shake);
  drawBG(S.theme,cam.x);
  for(const it of items){const x=it.x-cam.x,y=it.y+Math.sin(it.t*.1)*(it.y>=GY?0:0);
    if(it.t>760&&(it.t>>2)&1)continue;it.k==='bun'?drawBun(x,y):drawWine(x,y);}
  const sorted=enemies.slice().sort((a,b)=>(b.dead-a.dead)||(a.boss?1:0)-(b.boss?1:0));
  for(const e of sorted){if(e.boss)drawBoss(e);else drawSoldier(e);}
  drawPlayer();
  for(const f of fxs){const k=f.t/f.life;spr('guan','fxArc',f.x-cam.x,f.y,f.face,f.boss?.85:.8,1-k,'lighter');}
  for(const q of projs){const x=q.x-cam.x;
    if(q.k==='arrow'){ctx.strokeStyle='#d9c08a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-Math.sign(q.vx)*26,q.y);ctx.lineTo(x,q.y);ctx.stroke();
      ctx.fillStyle='#ddd';ctx.beginPath();ctx.moveTo(x+Math.sign(q.vx)*7,q.y);ctx.lineTo(x,q.y-3);ctx.lineTo(x,q.y+3);ctx.fill();
      R('#eee',x-Math.sign(q.vx)*26-(q.vx>0?0:6),q.y-3,6,6);}
    else if(q.k==='quake'){ctx.fillStyle='rgba(120,80,40,.55)';ctx.beginPath();ctx.moveTo(x-30,GY);ctx.lineTo(x,GY-34-Math.sin(G.t*.6)*6);ctx.lineTo(x+30,GY);ctx.fill();}
    else if(q.k==='cres'){const a=Math.min(1,q.life/20);
      spr('guan','fxArc',x,q.y,q.face,1.25,a,'lighter');spr('guan','fxArc',x-q.face*26,q.y,q.face,1.1,a*.6,'lighter');
      ctx.save();ctx.globalCompositeOperation='lighter';circle(x,q.y-90,60,`rgba(80,255,170,${.15*a})`);ctx.restore();}
  }
  for(const s of parts){const x=s.x-cam.x;
    if(s.k==='spark'){ctx.strokeStyle=s.c;ctx.globalAlpha=Math.min(1,s.life/10);ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x,s.y);ctx.lineTo(x-s.vx*2,s.y-s.vy*2);ctx.stroke();ctx.globalAlpha=1;}
    else{ctx.globalAlpha=s.life/s.max*.6;circle(x,s.y,s.r,s.c);ctx.globalAlpha=1;}}
  for(const t of texts)txt(t.s,t.x-cam.x,t.y,t.s.length>3?18:22,t.c,'center',FU,'rgba(0,0,0,.8)',4);
  ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H);}
  drawHUD();
  if(banner)drawBanner();
  if(G.paused)overlay('일시정지','P / Esc 로 계속');
  if(G.mode==='clear'){overlay(S.name.split('·')[0].trim()+' 완료!','',true);
    txt('점수  '+G.score.toLocaleString(),W/2,290,26,'#fff');txt('남은 체력 보너스  +'+G.bonus.toLocaleString(),W/2,330,20,'#9f9');
    if(G.ct>70&&(G.t>>5)&1)txt(G.stage+1<STAGES.length?'Enter / 공격 — 다음 장으로':'Enter / 공격 — 계속',W/2,400,20,'#ffe7a0');}
  if(G.mode==='over'){overlay('관운장이 쓰러졌다…','',true);txt('점수  '+G.score.toLocaleString(),W/2,290,24,'#fff');
    if(G.ct>60&&(G.t>>5)&1)txt('Enter / 공격 — 이 장을 다시 도전',W/2,360,20,'#ffe7a0');}
  if(G.mode==='ending')drawEnding();
}
function overlay(a,b,big){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);goldText(a,W/2,big?220:250,big?52:46);if(b)txt(b,W/2,310,20,'#ddd');}
function bar(x,y,w,h,v,c1,c2,label){
  R('rgba(0,0,0,.6)',x-2,y-2,w+4,h+4);R('#2a2420',x,y,w,h);
  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(x,y,w*Math.max(0,v),h);
  if(label)txt(label,x+6,y+h/2+1,12,'#fff','left',FU,'rgba(0,0,0,.8)',3);
}
function drawHUD(){
  const p=player;
  R('rgba(0,0,0,.55)',14,12,70,70);ctx.strokeStyle='#c9a24a';ctx.lineWidth=2;ctx.strokeRect(14,12,70,70);
  ctx.save();ctx.beginPath();ctx.rect(16,14,66,66);ctx.clip();
  const f=FR.idle2;ctx.drawImage(ATL.guan,f[0]+18,f[1],72,72,10,14,72,72);ctx.restore();
  txt('관우 운장',94,22,16,'#ffe7a0','left',FT);
  bar(94,36,250,16,p.hp/100,'#7ef07a','#2f9a3a','체력');
  bar(94,58,250,12,p.mp/100,p.mp>=50?'#9ff3ff':'#6ab0ff',p.mp>=50?'#2fb4d8':'#2a5cc8','기력');
  R('rgba(255,255,255,.6)',94+125,56,2,16);
  if(p.mp>=50&&(G.t>>4)&1)txt('필살 준비! (X)',352,64,13,'#9ff3ff','left');
  txt(G.score.toLocaleString(),W-20,26,26,'#fff','right');
  txt('최고 '+Math.max(G.hi,G.score).toLocaleString(),W-20,52,13,'#ccc','right');
  txt(STAGES[G.stage].name,W/2,22,15,'#f3e2b8','center',FT);
  if(p.combo>=2){const s=1+Math.min(.5,p.combo*.02);txt(p.combo+' 연격!',W-30,120,Math.round(30*s),p.combo>=15?'#ff8a3a':'#ffe066','right',FT);}
  if(goArrow>0&&cam.lock===null&&!G.bossOn&&G.wave>0&&(G.t>>4)&1){goldText('진격 ▶',W-90,H/2-30,34);}
  const b=enemies.find(e=>e.boss);
  if(b&&!b.dead){R('rgba(0,0,0,.6)',W/2-222,H-46,444,26);txt(b.name,W/2-214,H-58,16,'#ffb0a0','left',FT);
    bar(W/2-218,H-42,436,18,b.hp/b.max,'#ff7a5a','#a8261e');}
  if(muted)txt('🔇',W-20,78,14,'#fff','right');
}
function drawBanner(){
  const b=banner,a=Math.min(1,b.t/25,(200-b.t+30)/25);
  ctx.save();ctx.globalAlpha=Math.max(0,a);
  R(b.boss?'rgba(90,10,10,.6)':'rgba(0,0,0,.5)',0,H/2-70,W,120);
  goldText(b.text,W/2,H/2-18,b.boss?50:44);txt(b.sub,W/2,H/2+30,20,b.boss?'#ffb0a0':'#eee','center',FT);
  ctx.restore();
}
function drawTitle(){
  drawBG('field',G.t*.6);
  ctx.fillStyle='rgba(12,8,4,.5)';ctx.fillRect(0,0,W,H);
  shadow(250,GY,70);spr('guan',IDLE[(G.t/10|0)%6],250,GY+4,1,1.22);
  goldText('청룡언월전',620,150,86);
  txt('관운장 무쌍  ·  義의 칼날',620,222,24,'#f3e2b8','center',FT);
  R('rgba(0,0,0,.45)',450,262,340,150);
  const L=[['이동','← →  /  A D'],['점프','↑  /  Space  /  K'],['공격 (3연격)','Z  /  J'],['필살 · 청룡파','X  /  L   (기력 50)'],['일시정지 · 소리','P  ·  M']];
  L.forEach((l,i)=>{txt(l[0],470,286+i*27,15,'#ffe7a0','left');txt(l[1],770,286+i*27,15,'#fff','right');});
  if((G.t>>5)&1)txt('Enter  또는  화면을 눌러 시작',620,448,22,'#fff');
  txt('최고 점수  '+G.hi.toLocaleString(),620,490,14,'#ccc');
}
function drawEnding(){
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
  goldText('천하에 의를 떨치다',W/2,170,56);
  txt('세 적장을 모두 베고, 관운장의 이름이 천하에 울려 퍼졌다.',W/2,240,20,'#f3e2b8','center',FT);
  txt('최종 점수  '+G.score.toLocaleString(),W/2,300,30,'#fff');
  txt('최고 점수  '+G.hi.toLocaleString(),W/2,340,18,'#ccc');
  spr('guan',IDLE[(G.t/10|0)%6],W/2,H-30,1,.8);
  if(G.ct>120&&(G.t>>5)&1)txt('Enter — 타이틀로',W/2,390,18,'#ffe7a0');
}

/* ================= 루프 ================= */
let last=0,acc=0;
function loop(ts){
  requestAnimationFrame(loop);
  acc+=Math.min(100,ts-last);last=ts;
  let n=0;while(acc>=1000/60&&n<4){tick();acc-=1000/60;n++;for(const k in P)delete P[k];}
  render();
}
img.onload=()=>{buildAtlases();G.mode='title';};
img.src=ATLAS_SRC;
requestAnimationFrame(t=>{last=t;loop(t);});
</script>
